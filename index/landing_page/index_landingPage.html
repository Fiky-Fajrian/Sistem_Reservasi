
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <link rel="style" href="landingPage.css">
</head>
<body>

    <!-- Navigasi -->
    <nav>
        <a href="#home">Home</a> |
        <a href="#profil">Profil</a> |
        <a href="#kontak">Kontak</a>
    </nav>

    <!-- Konten Utama -->
    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Ini adalah halaman utama website saya.</p>
            <img src="gambar.jpg" alt="Gambar profil" width="200">
        </section>

        <!-- Profil -->
        <section id="profil">
            <h2>Profil Saya</h2>
            <p>Nama: Fiky</p>
            <p>Program Studi: TRPL</p>
            <p>Hobi: Belajar coding</p>
        </section>

        <!-- Formulir Kontak -->
        <section id="kontak">
            <h2>Hubungi Saya</h2>
            <form>
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="pesan">Pesan:</label>
                <textarea id="pesan" name="pesan"></textarea>

                <br><br>

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Website Saya</p>
    </footer>

</body>
</html>
